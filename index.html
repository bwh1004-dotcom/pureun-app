<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="푸른시점">
<meta name="theme-color" content="#FF8C42">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>푸른시점 반도체편</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--warm:#FFF8F0;--warm2:#FFE8CC;--text:#3D2B1F;--text2:#8B6347;--text3:#C4A882;--border:#FFD6A5;--orange:#FF8C42;--green:#5DBB63;--blue:#4A90E2}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--warm);height:100dvh;display:flex;flex-direction:column;max-width:420px;margin:0 auto;overflow:hidden}
#root{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* 온보딩 */
.ob{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 20px 32px;background:linear-gradient(160deg,var(--warm),var(--warm2));overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ob-logo{margin-bottom:12px}
.ob-title{font-size:26px;font-weight:800;color:#D4611A;margin-bottom:3px}
.ob-sub{font-size:11px;color:#E8934A;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.ob-desc{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:18px;white-space:pre-line}
.ob-char-row{display:flex;justify-content:center;gap:10px;margin-bottom:18px;width:100%}
.ob-char{background:#fff;border-radius:16px;padding:14px 10px;border:2px solid var(--border);flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.ob-char-emoji{font-size:30px}
.ob-char-name{font-size:11px;font-weight:800;color:var(--text)}
.ob-char-role{font-size:10px;color:#FF8C42;font-weight:700}
.ob-char-line{font-size:10px;color:var(--text2);line-height:1.4;text-align:center}
.ob-how{width:100%;display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.ob-how-row{background:#fff;border-radius:12px;padding:11px 14px;border:1.5px solid var(--border);display:flex;align-items:center;gap:11px;text-align:left}
.ob-how-ico{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.ob-how-t{font-size:12px;font-weight:800;color:var(--text);margin-bottom:2px}
.ob-how-d{font-size:11px;color:var(--text2);line-height:1.4}
.ob-ep-preview{width:100%;background:#fff;border-radius:14px;padding:14px;border:2px solid var(--border);margin-bottom:16px;text-align:left}
.ob-ep-preview-title{font-size:11px;font-weight:800;color:#FF8C42;margin-bottom:10px}
.ob-ep-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #FFE8CC}
.ob-ep-row:last-child{border:none}
.ob-footer{width:100%;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.ob-dots{display:flex;gap:5px;justify-content:center;margin-bottom:8px}
.ob-dot{height:6px;border-radius:3px;transition:all .3s;background:var(--border)}
.ob-dot.act{width:20px;background:#FF8C42}
.ob-dot:not(.act){width:6px}
.ob-btn{width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;font-size:14px;font-weight:800;background:linear-gradient(135deg,#FF8C42,#FF6B6B);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.3)}
.ob-skip{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;padding:4px}

/* 홈화면 */
.home{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--warm)}
.home-header{padding:14px 16px 10px;background:var(--warm);border-bottom:1px solid #FFE8CC;flex-shrink:0}
.home-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.home-logo{cursor:pointer}
.home-title{font-size:18px;font-weight:900;color:#D4611A;letter-spacing:-.5px;display:block}
.home-sub{font-size:9px;color:#E8934A;font-weight:700;letter-spacing:1px;display:block}
.prog-track{height:5px;background:#FFE8CC;border-radius:3px;overflow:hidden;margin-bottom:3px}
.prog-fill{height:100%;background:linear-gradient(90deg,#FF8C42,#FFB347);border-radius:3px;transition:width .4s}
.prog-info{display:flex;justify-content:space-between}
.tabs{display:flex;border-bottom:2px solid #FFE8CC;flex-shrink:0}
.tab{flex:1;padding:9px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab.act{color:#FF8C42;border-bottom-color:#FF8C42}
.ep-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 24px}
.ep-card{background:#fff;border-radius:14px;margin-bottom:8px;display:flex;overflow:hidden;border:1.5px solid #FFE0C0;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:all .2s}
.ep-card.done{background:#F0FFF5;border-color:#5DBB63}
.ep-thumb{width:88px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 6px;border-right:1px dashed var(--border);gap:4px;background:var(--warm)}
.ep-thumb-emoji{font-size:32px}
.ep-thumb-label{font-size:7px;font-weight:700;padding:2px 5px;border-radius:5px;text-align:center}
.ep-body{flex:1;padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.ep-tags{display:flex;gap:4px;margin-bottom:4px;align-items:center}
.ep-num-tag{font-size:9px;font-weight:800;padding:2px 6px;border-radius:6px}
.ep-section-tag{font-size:8px;color:var(--text3);margin-left:auto}
.ep-title{font-size:12px;font-weight:800;color:var(--text);line-height:1.35;margin-bottom:3px}
.ep-meta{font-size:10px;color:var(--text3)}

/* 잠금화면 */
.lock-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(160deg,var(--warm),var(--warm2));overflow-y:auto}
.lock-box{background:#fff;border-radius:14px;padding:14px;border:1.5px solid var(--border);width:100%;margin-bottom:16px;text-align:left}
.lock-list-title{font-size:10px;font-weight:800;color:#FF8C42;margin-bottom:10px;letter-spacing:.3px}
.lock-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);margin-bottom:7px}
.lock-price-box{background:linear-gradient(135deg,#FF8C42,#FF6B6B);border-radius:16px;padding:16px;width:100%;margin-bottom:12px;color:#fff;text-align:center}
.lock-btn{width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;font-size:14px;font-weight:800;background:linear-gradient(135deg,#FF8C42,#FF6B6B);color:#fff;box-shadow:0 4px 16px rgba(255,107,107,.3);margin-bottom:8px}
.lock-btn2{width:100%;padding:11px;border-radius:14px;border:2px solid #FF8C42;background:#fff;color:#FF8C42;font-size:12px;font-weight:700;cursor:pointer}

/* 리더 */
.reader{flex:1;display:flex;flex-direction:column;overflow:hidden}
.reader-hd{padding:10px 13px;display:flex;align-items:center;gap:9px;background:var(--warm);border-bottom:2px dashed var(--border);flex-shrink:0}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer}
.ep-hd-info{flex:1}
.ep-hd-num{font-size:9px;font-weight:700;letter-spacing:.5px}
.ep-hd-title{font-size:12px;font-weight:800;color:var(--text)}
.prog-dots{display:flex;gap:3px;align-items:center}
.prog-dot{height:4px;border-radius:2px;background:var(--border);transition:all .3s}
.prog-dot.act{width:14px}
.prog-dot:not(.act){width:4px}
.page-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:14px}
@keyframes slideIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}

/* 삽화 */
.illust-box{border-radius:14px;overflow:hidden;margin-bottom:12px}
.illust-ph{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--border)}
.illust-caption{padding:7px 12px;background:rgba(0,0,0,.03);font-size:11px;font-weight:700;color:var(--text2);text-align:center;border-top:1px solid var(--border)}

/* 말풍선 */
.bubbles{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.brow{display:flex;gap:9px;align-items:flex-end}
.brow.right{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid rgba(0,0,0,.07);flex-shrink:0}
.avatar-emoji{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;border:2px solid rgba(0,0,0,.07)}
.bubble{max-width:76%;padding:9px 12px;border-radius:13px;font-size:14px;line-height:1.7;font-weight:500}
.bubble.left{background:#fff;border:1.5px solid var(--border);border-bottom-left-radius:3px;color:var(--text)}
.bubble.right{border-bottom-right-radius:3px;color:#fff}
.bname{font-size:9px;font-weight:700;margin-bottom:3px;opacity:.75}

/* 팩트 */
.fact-title{font-size:13px;font-weight:800;color:#D4611A;margin-bottom:10px;text-align:center}
.fact-box{border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:4px solid}
.fact-ico{font-size:18px;margin-bottom:3px;display:block}
.fact-t{font-size:12px;font-weight:800;margin-bottom:3px}
.fact-d{font-size:13px;line-height:1.7;color:var(--text)}

/* 퀴즈 */
.quiz-title{font-size:13px;font-weight:800;color:#D4467A;text-align:center}
.quiz-prog{display:flex;gap:4px;justify-content:center;margin:8px 0 12px}
.quiz-prog-dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.quiz-prog-dot.done{background:#5DBB63}
.quiz-prog-dot.curr{background:#D4467A;transform:scale(1.3)}
.quiz-box{background:#FFF0F5;border-radius:13px;padding:13px;border:2px solid #FFB3C8}
.quiz-q{font-size:13px;font-weight:800;color:#D4467A;margin-bottom:10px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:6px}
.quiz-opt{background:#fff;border:2px solid #FFD6E7;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);text-align:left;transition:all .2s}
@keyframes correct-pop{0%{transform:scale(1)}30%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes wrong-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.quiz-opt.correct{background:#E8F8E8;border-color:#5DBB63;color:#2D7A32;animation:correct-pop .4s ease}
.quiz-opt.wrong{background:#FFF0F0;border-color:#FF8080;color:#CC3333;animation:wrong-shake .35s ease}
.quiz-result{font-size:12px;font-weight:700;text-align:center;padding:8px;border-radius:9px;margin-top:7px}

/* 심화 */
.deep-note{background:linear-gradient(135deg,#FFF3E0,#FFE8CC);border-radius:12px;padding:12px 14px;border:1.5px solid var(--border);margin-top:8px}
.deep-note-title{font-size:11px;font-weight:800;color:#FF8C42;margin-bottom:6px}
.deep-note-text{font-size:13px;color:var(--text);line-height:1.75}

/* 완료 */
.complete-box{text-align:center;padding:24px 14px;position:relative;overflow:hidden}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(400px) rotate(720deg);opacity:0}}
.confetti-dot{position:absolute;width:8px;height:8px;border-radius:50%;animation:confettiFall linear forwards;pointer-events:none}
@keyframes spin{from{transform:rotate(-20deg)scale(.5)}to{transform:rotate(0)scale(1)}}
.complete-star{font-size:52px;margin-bottom:10px;display:block;animation:spin .6s ease}
.complete-title{font-size:20px;font-weight:800;color:#D4611A;margin-bottom:5px}
.complete-sub{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:16px}
.review-card{background:#fff;border-radius:14px;padding:14px;border:2px solid var(--border);margin-bottom:14px;text-align:left}
.review-card-title{font-size:10px;font-weight:800;color:#FF8C42;margin-bottom:8px}
.review-item{display:flex;gap:7px;font-size:13px;color:var(--text);margin-bottom:6px;line-height:1.55;align-items:flex-start}
.review-num{width:20px;height:20px;border-radius:50%;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.next-box{border-radius:14px;padding:14px;margin-bottom:12px;color:#fff;text-align:left}
.next-label{font-size:9px;font-weight:700;opacity:.75;margin-bottom:4px;letter-spacing:1px}
.next-title{font-size:14px;font-weight:800;margin-bottom:5px}
.next-preview{font-size:12px;opacity:.85;line-height:1.5;white-space:pre-line;margin-bottom:10px}
.next-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;color:#fff;cursor:pointer}

/* 수료증 */
.cert-screen{flex:1;overflow-y:auto;background:linear-gradient(160deg,var(--warm),var(--warm2));padding:24px 16px}
.cert-box{background:#fff;border-radius:20px;padding:24px 20px;border:3px solid var(--border);margin-bottom:20px;position:relative;text-align:center}
.cert-stamp{position:absolute;top:16px;right:16px;font-size:28px;transform:rotate(15deg);opacity:.8}
.cert-top{font-size:10px;font-weight:700;color:#FF8C42;letter-spacing:1px;margin-bottom:12px}
.cert-logo{font-size:40px;margin-bottom:8px}
.cert-title{font-size:18px;font-weight:800;color:#D4611A;margin-bottom:4px}
.cert-name{font-size:14px;color:var(--text2);margin-bottom:14px}
.cert-list{display:flex;flex-direction:column;gap:5px;text-align:left;margin-bottom:12px}
.cert-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);background:var(--warm);border-radius:8px;padding:6px 10px}
.cert-bottom{font-size:10px;color:var(--text3)}
.cert-restart-btn{width:100%;padding:13px;border-radius:14px;border:none;cursor:pointer;font-size:14px;font-weight:800;background:linear-gradient(135deg,#FF8C42,#FF6B6B);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.3)}

/* 네비 */
.page-nav{display:flex;gap:7px;padding:10px 13px;border-top:2px dashed var(--border);background:var(--warm);flex-shrink:0}
.nav-btn{flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:13px;font-weight:800;transition:all .2s}
.nav-prev{background:#FFE8CC;color:#C4733A}
.nav-next{color:#fff;box-shadow:0 3px 10px rgba(255,107,107,.25)}
.nav-btn:disabled{opacity:.28;cursor:default;box-shadow:none}

/* 배경 파티클 */
.bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.ob,.home,.lock-screen,.cert-screen{position:relative;z-index:1}
</style>
</head>

const CONFETTI=['#FF8C42','#FF6B6B','#5DBB63','#4A90E2','#FFD700','#FF69B4'];

function Confetti(){
  const dots=Array.from({length:20},(_,i)=>({
    id:i,color:CONFETTI[i%6],
    left:Math.random()*100,
    delay:Math.random()*.8,
    dur:1.2+Math.random()*.8
  }));
  return e('div',{style:{position:'absolute',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none',overflow:'hidden'}},
    dots.map(d=>e('div',{key:d.id,className:'confetti-dot',style:{background:d.color,left:d.left+'%',top:'-10px',animationDuration:d.dur+'s',animationDelay:d.delay+'s'}}))
  );
}

function SeedCanvas(){
  const ref=useRef(null);
  useEffect(()=>{
    const cv=ref.current;
    if(!cv)return;
    const ctx=cv.getContext('2d');
    let raf;
    const W=()=>cv.offsetWidth||320;
    const H=()=>cv.offsetHeight||600;
    cv.width=W()*2; cv.height=H()*2; ctx.scale(2,2);
    const CHARS=['🌱','🌿','✨','🌾','🍀','🌸'];
    const seeds=Array.from({length:24},()=>({
      x:Math.random()*W(),y:H()+Math.random()*60,
      size:4+Math.random()*4,speed:.25+Math.random()*.5,
      op:.06+Math.random()*.25,wobble:Math.random()*Math.PI*2,
      ws:.015+Math.random()*.02,char:CHARS[Math.floor(Math.random()*CHARS.length)]
    }));
    function draw(){
      ctx.clearRect(0,0,W(),H());
      seeds.forEach(s=>{
        s.y-=s.speed; s.wobble+=s.ws; s.op-=.0004;
        if(s.y<-20||s.op<=0){
          s.y=H()+20; s.x=Math.random()*W();
          s.op=.08+Math.random()*.2;
          s.char=CHARS[Math.floor(Math.random()*CHARS.length)];
        }
        ctx.save(); ctx.globalAlpha=Math.max(0,s.op);
        ctx.font=(s.size*2)+'px serif'; ctx.textAlign='center';
        ctx.fillText(s.char,s.x+Math.sin(s.wobble)*4,s.y);
        ctx.restore();
      });
      raf=requestAnimationFrame(draw);
    }
    draw();
    return()=>cancelAnimationFrame(raf);
  },[]);
  return e('canvas',{ref,className:'bg-canvas'});
}

function LottieAnim({size=80}){
  const ref=useRef(null);
  const[ok,setOk]=useState(false);
  useEffect(()=>{
    if(!ref.current)return;
    try{
      const anim=window.lottie&&window.lottie.loadAnimation({
        container:ref.current,renderer:'svg',loop:true,autoplay:true,
        animationData:LOTTIE_DATA
      });
      if(anim){setOk(true);return()=>anim.destroy();}
    }catch(err){}
  },[]);
  return e('div',{style:{width:size,height:size,display:'flex',alignItems:'center',justifyContent:'center'}},
    e('div',{ref,style:{width:size,height:size,display:ok?'block':'none'}}),
    !ok&&e('div',{style:{fontSize:size*.5}},'🌱')
  );
}

function Avatar({ch}){
  if(ch.img) return e('img',{src:ch.img,className:'avatar'});
  return e('div',{className:'avatar-emoji',style:{background:ch.bg}},ch.emoji);
}

function BubbleRow({b}){
  const ch=CHARS[b.char];
  return e('div',{className:'brow'+(b.side==='right'?' right':'')},
    e(Avatar,{ch}),
    e('div',{className:'bubble '+(b.side==='left'?'left':'right'),
      style:b.side==='right'?{background:ch.color}:{}},
      e('div',{className:'bname'},ch.name),b.text)
  );
}

  );
}

  const[quizSels,setQuizSels]=useState({});
  const[doneEps,setDoneEps]=useState(new Set());
  const[unlocked,setUnlocked]=useState(false);
  const[streak,setStreak]=useState(0);

  function finishOb(){try{localStorage.setItem('p_ob','1');}catch{}setOnboarded(true);}
  function saveDone(s){try{localStorage.setItem('p_done',JSON.stringify([...s]));}catch{}}
  function doUnlock(){try{localStorage.setItem('p_unlock','1');}catch{}setUnlocked(true);}
  function updateStreak(){
    try{
      const today=new Date().toDateString();
      const last=localStorage.getItem('p_last');
      const cnt=parseInt(localStorage.getItem('p_streak')||'0');
      const diff=last?(new Date(today)-new Date(last))/(1000*60*60*24):999;
      const n=diff<=1?cnt+1:1;
      localStorage.setItem('p_last',today);
      localStorage.setItem('p_streak',String(n));
      setStreak(n);
    }catch{}
  }
  function startEp(idx){
    setCurEp(idx);setScreen('reader');setPage(0);setQuizSels({});updateStreak();
  }
  function goPage(n){setPage(n);}

  const SECTIONS=[
    {id:'basic',label:'기초편',eps:[0,1,2,3,4],locked:false},
    {id:'deep', label:'심화편',eps:[5,6,7,8,9,17,18],locked:true},
    {id:'news', label:'뉴스편',eps:[10,11,12,13,14,15,16],locked:true},
  ];
  const curSection=SECTIONS.find(s=>s.id===homeTab)||SECTIONS[0];
  const ep=EPISODES[curEp];
  const EP=ep?ep.pages:[];
  const P=EP[page]||{};
  const isLast=page===EP.length-1;
  const allDone=doneEps.size===EPISODES.length;
  const quizCount=EP.filter(p=>p.type==='quiz').length;
  const quizDone=Object.keys(quizSels).length;
  const canNext=P.type!=='quiz'||(quizSels[P.quizIdx]!==undefined);

  // ── 온보딩 ──
  if(!onboarded) return e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'auto'}},

    obStep===0&&e('div',{key:'s0',className:'ob'},
      e(LottieAnim,{size:90}),
      e('div',{className:'ob-title'},'푸른시점'),
      e('div',{className:'ob-sub'},'산업편 · 반도체'),
      e('div',{className:'ob-desc'},'처음 만나는 것들을 신선한 눈으로\n모르는 게 당연한 그 시점에서, 함께 배워요.'),

          {key:'uno',line:'반도체 공부 중!\n쉽게 설명해줄게 😄'},
          {key:'pureun',line:'궁금한 게 많아!\n왜요? 어떻게요? 🤔'},
          {key:'ojjang',line:'같이 배우면\n더 재미있어! 😊'},
        ].map(({key,line})=>{
          const ch=CHARS[key];

            ch.img?e('img',{src:ch.img,style:{width:52,height:52,borderRadius:'50%',objectFit:'cover',border:'2.5px solid rgba(0,0,0,.07)',marginBottom:4}}):e('div',{className:'ob-char-emoji'},ch.emoji),
            e('div',{className:'ob-char-name'},ch.name),

            e('div',{className:'ob-char-line'},line)

          e('span',{className:'home-sub'},'반도체편')

      ),
      e('div',{className:'prog-track'},e('div',{className:'prog-fill',style:{width:(doneEps.size/EPISODES.length*100)+'%'}})),
      e('div',{className:'prog-info'},

        )
      )
    ),
    e('div',{className:'tabs'},
      SECTIONS.map(sec=>e('div',{key:sec.id,className:'tab'+(homeTab===sec.id?' act':''),onClick:()=>setHomeTab(sec.id)},

    ),
    curSection.locked&&!unlocked
      ?e('div',{className:'lock-screen'},
        e('div',{style:{fontSize:48,marginBottom:12}},'🔒'),
        e('div',{style:{fontSize:18,fontWeight:800,color:'#D4611A',marginBottom:6}},'잠금 해제가 필요해요'),
        e('div',{style:{fontSize:12,color:'#8B6347',lineHeight:1.75,marginBottom:20}},
          '기초편이 마음에 드셨나요?\n심화편·뉴스편을 모두 즐겨보세요!'),
        e('div',{className:'lock-box'},
          e('div',{className:'lock-list-title'},'잠금 해제 시 이용 가능 ✅'),
          [{ico:'🏭',txt:'심화편 5화 + 공정편 2화'},
           {ico:'📰',txt:'뉴스편 7화'},
           {ico:'🔄',txt:'뉴스 업데이트 에피소드'},
           {ico:'📋',txt:'전체 수료증'},
          ].map((item,i)=>e('div',{key:i,className:'lock-item'},e('span',null,item.ico),item.txt))
        ),
        e('div',{className:'lock-price-box'},
          e('div',{style:{fontSize:10,opacity:.85,marginBottom:4,letterSpacing:.5}},'평생 이용권'),
          e('div',{style:{fontSize:28,fontWeight:900,marginBottom:2}},'2,500원'),
          e('div',{style:{fontSize:10,opacity:.85}},'한 번 결제로 영구 이용')
        ),
        e('button',{className:'lock-btn',onClick:doUnlock},'잠금 해제하기 🔓'),
        e('button',{className:'lock-btn2',onClick:()=>setHomeTab('basic')},'기초편으로 돌아가기')
      )
      :e('div',{className:'ep-list'},
        curSection.eps.map(i=>{
          const ep=EPISODES[i];
          const done=doneEps.has(i);
          return e('div',{key:i,className:'ep-card'+(done?' done':''),onClick:()=>startEp(i)},
            e('div',{className:'ep-thumb',style:{borderRight:'1px dashed '+ep.color+'40',padding:0,overflow:'hidden'}},
              e('img',{
                src:'./illust/ep'+ep.num+'-1.jpg',
                style:{width:88,height:88,objectFit:'cover',display:'block'},
                onError:(ev)=>{
                  if(!ev.target.dataset.tried){
                    ev.target.dataset.tried='1';
                    ev.target.src='./illust/EP'+ep.num+'-1.jpg';
                  } else {
                    ev.target.style.display='none';
                    ev.target.parentNode.style.cssText='display:flex;align-items:center;justify-content:center;padding:10px 6px;';
                    ev.target.parentNode.innerHTML='<div style="font-size:32px">'+ep.emoji+'</div>';
                  }
                }
              })
            ),
            e('div',{className:'ep-body'},
              e('div',{className:'ep-tags'},
                e('div',{className:'ep-num-tag',style:{background:ep.color+'18',color:ep.color}},'EP'+ep.num),
                done&&e('div',{className:'ep-num-tag',style:{background:'#5DBB6318',color:'#5DBB63'}},'✅'),
                e('div',{className:'ep-section-tag'},ep.num<=5?'기초':ep.num<=10||ep.num>=18?'심화':'뉴스')
              ),
              e('div',{className:'ep-title'},ep.title),
              e('div',{className:'ep-meta'},ep.pages.length+'페이지 · 퀴즈 '+ep.pages.filter(p=>p.type==='quiz').length+'개 · 약 8분')
            )
          );
        }),
        allDone&&e('button',{onClick:()=>setScreen('cert'),style:{background:'linear-gradient(135deg,#FFD700,#FF8C42)',color:'#fff',border:'none',borderRadius:14,padding:'12px',width:'100%',fontSize:13,fontWeight:800,cursor:'pointer',marginTop:4}},'🎉 수료증 보기')
      )
  );

  // ── 리더 ──
  return e('div',{className:'reader'},
    e('div',{className:'reader-hd'},
      e('button',{className:'back-btn',onClick:()=>setScreen('home')},'←'),
      e('div',{className:'ep-hd-info'},
        e('div',{className:'ep-hd-num',style:{color:ep.color}},'EP'+ep.num+' · 약 8분'),
        e('div',{className:'ep-hd-title'},ep.title)
      ),
      e('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3}},
        e('div',{className:'prog-dots'},EP.map((_,i)=>e('div',{key:i,className:'prog-dot'+(i===page?' act':''),style:i===page?{background:ep.color,width:14}:{}}))),
        e('div',{style:{fontSize:8,color:'#C4A882'}},'퀴즈 '+quizDone+'/'+quizCount)
      )
    ),
    e('div',{className:'page-scroll'},
      e('div',{className:'page',key:page,style:{animation:'slideIn .25s ease'}},

        P.type==='scene'&&e(React.Fragment,null,
          e(IllustPH,{illust:P.illust,caption:P.caption,epNum:ep.num,page}),
          e('div',{className:'bubbles'},P.bubbles.map((b,i)=>e(BubbleRow,{key:i,b})))
        ),

        P.type==='fact'&&e(React.Fragment,null,
          e('div',{className:'fact-title'},'✨ 핵심 정리'),
          P.facts.map((f,i)=>e('div',{key:i,className:'fact-box',style:{background:f.bg,borderLeftColor:f.color}},
            e('span',{className:'fact-ico'},f.icon),
            e('div',{className:'fact-t',style:{color:f.color}},f.title),
            e('div',{className:'fact-d'},f.text)
          ))
        ),

        P.type==='deep'&&e(React.Fragment,null,
          e(IllustPH,{illust:P.illust,caption:P.caption,epNum:ep.num,page}),
          e('div',{className:'bubbles'},P.bubbles.map((b,i)=>e(BubbleRow,{key:i,b}))),
          e('div',{className:'deep-note'},
            e('div',{className:'deep-note-title'},'🔍 더 깊이'),
            e('div',{className:'deep-note-text'},P.deepNote)
          )
        ),

        P.type==='quiz'&&e('div',null,
          e('div',{className:'quiz-title'},'🧩 퀴즈 '+(P.quizIdx+1)+'/'+quizCount),
          e('div',{className:'quiz-prog'},
            Array.from({length:quizCount},(_,i)=>e('div',{key:i,className:'quiz-prog-dot'+(i<quizDone?' done':i===P.quizIdx?' curr':'')}))
          ),
          e('div',{className:'quiz-box'},
            e('div',{className:'quiz-q'},P.q),
            e('div',{className:'quiz-opts'},P.opts.map((opt,i)=>
              e('button',{key:i,
                className:'quiz-opt'+(quizSels[P.quizIdx]===i?(i===P.ans?' correct':' wrong'):''),
                onClick:()=>setQuizSels(prev=>({...prev,[P.quizIdx]:i})),
                disabled:quizSels[P.quizIdx]!==undefined},opt)
            )),
            quizSels[P.quizIdx]!==undefined&&e('div',{className:'quiz-result',
              style:{background:quizSels[P.quizIdx]===P.ans?'#E8F8E8':'#FFF0F0',color:quizSels[P.quizIdx]===P.ans?'#2D7A32':'#CC3333'}},
              quizSels[P.quizIdx]===P.ans?P.correct:P.wrong)
          )
        ),

        P.type==='complete'&&e('div',{className:'complete-box'},
          e(Confetti),
          e('span',{className:'complete-star'},'🌟'),
          e('div',{className:'complete-title'},'에피소드 '+ep.num+' 완료!'),
          e('div',{className:'complete-sub'},'퀴즈 '+quizDone+'/'+quizCount+' 완료! 😊'),
          e('div',{className:'review-card'},
            e('div',{className:'review-card-title'},'📋 핵심 요약'),
            (P.review||[]).map((r,i)=>e('div',{key:i,className:'review-item'},
              e('div',{className:'review-num',style:{background:ep.color}},i+1),r
            ))
          ),
          e('div',{className:'review-card',style:{marginBottom:14}},
            e('div',{className:'review-card-title'},'🧩 퀴즈 결과'),
            EP.filter(p=>p.type==='quiz').map((qp,i)=>{
              const sel=quizSels[qp.quizIdx];
              const correct=sel===qp.ans;
              return e('div',{key:i,style:{padding:'7px 0',borderBottom:'1px dashed #FFE8CC',fontSize:12}},
                e('div',{style:{display:'flex',alignItems:'flex-start',gap:6,marginBottom:3}},
                  e('span',null,correct?'✅':'❌'),
                  e('div',{style:{color:'#3D2B1F',fontWeight:600,lineHeight:1.5}},qp.q)
                ),
                !correct&&e('div',{style:{fontSize:11,color:'#4A90E2',paddingLeft:20,marginTop:2}},
                  '정답: '+qp.opts[qp.ans]
                )
              );
            })
          ),
          P.nextNum>0&&e('div',{className:'next-box',style:{background:'linear-gradient(135deg,#4A90E2,#5C6BC0)'}},
            e('div',{className:'next-label'},'NEXT EPISODE'),
            e('div',{className:'next-title'},'EP'+P.nextNum+' · '+P.nextTitle),
            e('div',{className:'next-preview'},P.nextPreview),
            e('button',{className:'next-btn',onClick:()=>startEp(curEp+1)},'다음화 보기 →')
          ),
          P.nextNum<0&&e('button',{onClick:()=>setScreen('cert'),style:{background:'linear-gradient(135deg,#FFD700,#FF8C42)',color:'#fff',border:'none',borderRadius:12,padding:'12px',width:'100%',fontSize:13,fontWeight:800,cursor:'pointer'}},'🎉 수료증 받기!')
        )
      )
    ),
    e('div',{className:'page-nav'},
      e('button',{className:'nav-btn nav-prev',onClick:()=>goPage(page-1),disabled:page===0},'← 이전'),
      e('button',{className:'nav-btn nav-next',
        style:{background:canNext?'linear-gradient(135deg,'+ep.color+',#FF6B6B)':'#ddd'},
        onClick:()=>{
          if(isLast){const nd=new Set(doneEps);nd.add(curEp);setDoneEps(nd);saveDone(nd);setScreen('home');}
          else goPage(page+1);
        },
        disabled:!canNext
      },isLast?'완료! 🌟':'다음 →')
    )
  );
}

};
function IllustPH({illust,caption,epNum,page}){
  let src=null;
  const sm=EP_SCENE_MAP[epNum];
  if(sm&&sm[page]) src='./illust/ep'+epNum+'-'+sm[page]+'.jpg';
  return e('div',{className:'illust-box'},
    src&&e('img',{src,style:{width:'100%',borderRadius:14,display:'block'},
      onError:(ev)=>{
        if(!ev.target.dataset.tried){ev.target.dataset.tried='1';ev.target.src=ev.target.src.replace('/ep','/EP');}
        else{ev.target.style.display='none';if(ev.target.nextSibling)ev.target.nextSibling.style.display='flex';}
      }}),
    e('div',{className:'illust-ph',style:{background:illust.bg,display:src?'none':'flex'}},
      e('div',{style:{fontSize:40}},illust.emoji),
      e('div',{style:{fontSize:9,fontWeight:700,color:'#fff',background:'rgba(0,0,0,.25)',padding:'2px 8px',borderRadius:16}},illust.label)
    ),
    caption&&e('div',{className:'illust-caption'},caption)
  );
}
ReactDOM.render(e(App),document.getElementById('root'));
</script>
