<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>푸른시점 산업편</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--warm:#FFF8F0;--warm2:#FFE8CC;--text:#3D2B1F;--text2:#8B6347;--text3:#C4A882;--border:#FFD6A5}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--warm);height:100dvh;display:flex;flex-direction:column;max-width:420px;margin:0 auto;overflow:hidden}
#root{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* ONBOARDING */
.ob{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 20px 32px;background:linear-gradient(160deg,var(--warm),var(--warm2));overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;animation:fadeUp .35s ease;text-align:center}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.ob-logo{font-size:60px;margin-bottom:12px;animation:bounce 2s infinite}
.ob-title{font-size:26px;font-weight:800;color:#D4611A;margin-bottom:3px;letter-spacing:-.5px}
.ob-sub{font-size:11px;color:#E8934A;font-weight:700;margin-bottom:8px;letter-spacing:.5px;text-transform:uppercase}
.ob-desc{font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:18px;white-space:pre-line}
.ob-char-row{display:flex;justify-content:center;gap:10px;margin-bottom:18px;width:100%}
.ob-char{background:#fff;border-radius:16px;padding:14px 10px;border:2px solid var(--border);flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.ob-char-emoji{font-size:30px}
.ob-char-name{font-size:11px;font-weight:800;color:var(--text)}
.ob-char-role{font-size:10px;color:#FF8C42;font-weight:700}
.ob-char-line{font-size:10px;color:var(--text2);line-height:1.4;text-align:center}
.ob-how{width:100%;display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.ob-how-row{background:#fff;border-radius:12px;padding:11px 14px;border:1.5px solid var(--border);display:flex;align-items:center;gap:11px;text-align:left}
.ob-how-ico{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.ob-how-t{font-size:12px;font-weight:800;color:var(--text);margin-bottom:2px}
.ob-how-d{font-size:11px;color:var(--text2);line-height:1.4}
.ob-ep-preview{width:100%;background:#fff;border-radius:14px;padding:14px;border:2px solid var(--border);margin-bottom:16px;text-align:left}
.ob-ep-preview-title{font-size:11px;font-weight:800;color:#FF8C42;margin-bottom:10px;letter-spacing:.3px}
.ob-ep-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed #FFE8CC}
.ob-ep-row:last-child{border:none}
.ob-footer{width:100%;display:flex;flex-direction:column;gap:6px;padding-top:4px}
.ob-dots{display:flex;gap:5px;justify-content:center;margin-bottom:8px}
.ob-dot{height:6px;border-radius:3px;transition:all .3s;background:var(--border)}
.ob-dot.act{width:20px;background:#FF8C42}
.ob-dot:not(.act){width:6px}
.ob-btn{width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;font-size:14px;font-weight:800;background:linear-gradient(135deg,#FF8C42,#FF6B6B);color:#fff;box-shadow:0 4px 14px rgba(255,107,107,.3)}
.ob-skip{background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;padding:4px}

/* SPLASH */
.splash{flex:1;display:flex;flex-direction:column;align-items:center;padding:22px 18px 32px;background:linear-gradient(160deg,var(--warm),var(--warm2));overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.splash-logo{font-size:52px;margin-bottom:10px;animation:bounce 2s infinite}
.splash-title{font-size:24px;font-weight:800;color:#D4611A;margin-bottom:2px}
.splash-sub{font-size:11px;color:#E8934A;font-weight:700;margin-bottom:12px}
.splash-chars{display:flex;justify-content:center;gap:14px;margin-bottom:14px}
.splash-char{display:flex;flex-direction:column;align-items:center;gap:3px}
.char-bubble{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:23px;border:2.5px solid rgba(0,0,0,.07)}
.char-name{font-size:9px;font-weight:700;color:var(--text2);text-align:center}
.ep-card{background:#fff;border:2px solid var(--border);border-radius:14px;padding:11px 13px;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;margin-bottom:7px;transition:all .2s}
.ep-card.done{background:rgba(93,187,99,.07);border-color:#5DBB63}
.ep-card.locked{opacity:.5;cursor:default}
.ep-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ep-num{font-size:9px;font-weight:700;margin-bottom:1px}
.ep-title{font-size:12px;font-weight:800;color:var(--text);line-height:1.3}
.ep-arrow{font-size:15px;margin-left:auto;flex-shrink:0}
.splash-progress{width:100%;background:#FFE8CC;border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.splash-prog-txt{font-size:12px;font-weight:700;color:#D4611A}
.splash-prog-bar{flex:1;height:6px;background:rgba(255,255,255,.6);border-radius:3px;margin:0 10px;overflow:hidden}
.splash-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FF8C42,#FF6B6B);transition:width .4s ease}

/* READER */
.reader{flex:1;display:flex;flex-direction:column;overflow:hidden}
.reader-header{padding:10px 13px;display:flex;align-items:center;gap:9px;background:var(--warm);border-bottom:2px dashed var(--border);flex-shrink:0}
.back-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:2px;line-height:1}
.ep-info{flex:1}
.ep-num-hd{font-size:9px;font-weight:700;letter-spacing:.5px}
.ep-title-hd{font-size:12px;font-weight:800;color:var(--text)}
.prog-dots{display:flex;gap:4px;align-items:center}
.prog-dot{height:5px;border-radius:3px;background:var(--border);transition:all .3s}
.prog-dot.act{width:16px}
.prog-dot:not(.act){width:5px}
.page-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{padding:14px;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.scene-box{border-radius:16px;padding:16px;margin-bottom:12px;text-align:center;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.scene-emoji{font-size:50px;margin-bottom:7px;display:block;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.scene-caption{font-size:13px;font-weight:700;color:rgba(0,0,0,.65);line-height:1.55}
.bubbles{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.bubble-row{display:flex;gap:9px;align-items:flex-end}
.bubble-row.right{flex-direction:row-reverse}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;border:2px solid rgba(0,0,0,.07)}
.bubble{max-width:76%;padding:9px 12px;border-radius:13px;font-size:14px;line-height:1.7;font-weight:500}
.bubble.left{background:#fff;border:1.5px solid var(--border);border-bottom-left-radius:3px;color:var(--text)}
.bubble.right{border-bottom-right-radius:3px;color:#fff}
.bname{font-size:9px;font-weight:700;margin-bottom:3px;opacity:.75}
.fact-title-row{font-size:13px;font-weight:800;color:#D4611A;margin-bottom:10px;text-align:center}
.fact-box{border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:4px solid}
.fact-ico{font-size:18px;margin-bottom:3px;display:block}
.fact-t{font-size:12px;font-weight:800;margin-bottom:3px}
.fact-d{font-size:13px;line-height:1.7;color:var(--text)}
.quiz-title-row{font-size:13px;font-weight:800;color:#D4467A;margin-bottom:10px;text-align:center}
.quiz-box{background:#FFF0F5;border-radius:13px;padding:14px;border:2px solid #FFB3C8}
.quiz-q{font-size:14px;font-weight:800;color:#D4467A;margin-bottom:11px;line-height:1.5}
.quiz-opts{display:flex;flex-direction:column;gap:7px}
.quiz-opt{background:#fff;border:2px solid #FFD6E7;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text);text-align:left;transition:all .2s}
.quiz-opt.correct{background:#E8F8E8;border-color:#5DBB63;color:#2D7A32}
.quiz-opt.wrong{background:#FFF0F0;border-color:#FF8080;color:#CC3333;animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.quiz-result{font-size:12px;font-weight:700;text-align:center;padding:8px;border-radius:9px;margin-top:8px}

/* COMPLETE */
.complete-box{text-align:center;padding:28px 14px;position:relative;overflow:hidden}
.confetti-wrap{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.confetti-dot{position:absolute;width:8px;height:8px;border-radius:50%;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0deg);opacity:1}100%{transform:translateY(400px) rotate(720deg);opacity:0}}
.complete-star{font-size:52px;margin-bottom:10px;animation:spin .6s ease}
@keyframes spin{from{transform:rotate(-20deg)scale(.5)}to{transform:rotate(0)scale(1)}}
.complete-title{font-size:20px;font-weight:800;color:#D4611A;margin-bottom:5px}
.complete-sub{font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:16px;white-space:pre-line}
.complete-review{background:#FFF3E0;border-radius:12px;padding:13px;text-align:left;margin-bottom:14px}
.review-title{font-size:10px;font-weight:800;color:#FF8C42;margin-bottom:7px;letter-spacing:.3px}
.review-item{display:flex;gap:6px;font-size:13px;color:#5C3D1E;margin-bottom:5px;line-height:1.55}
.next-ep-btn{font-size:13px;font-weight:800;padding:11px 14px;background:none;border:2px solid;border-radius:12px;cursor:pointer;margin-bottom:8px;width:100%;transition:all .2s}

/* ALL COMPLETE */
.all-complete{text-align:center;padding:32px 16px;display:flex;flex-direction:column;align-items:center}
.cert-box{background:#fff;border-radius:20px;padding:24px 20px;border:3px solid #FFD6A5;width:100%;margin-bottom:20px;position:relative}
.cert-top{font-size:10px;font-weight:700;color:#FF8C42;letter-spacing:1px;margin-bottom:12px}
.cert-logo{font-size:40px;margin-bottom:8px}
.cert-title{font-size:18px;font-weight:800;color:#D4611A;margin-bottom:4px}
.cert-name{font-size:15px;color:var(--text2);margin-bottom:12px}
.cert-list{display:flex;flex-direction:column;gap:5px;text-align:left;margin-bottom:12px}
.cert-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text);background:#FFF8F0;border-radius:8px;padding:6px 10px}
.cert-stamp{position:absolute;top:16px;right:16px;font-size:28px;transform:rotate(15deg);opacity:.8}
.cert-bottom{font-size:10px;color:var(--text3)}

/* NAV */
.page-nav{display:flex;gap:7px;padding:10px 13px;border-top:2px dashed var(--border);background:var(--warm);flex-shrink:0}
.nav-btn{flex:1;padding:12px;border-radius:12px;border:none;cursor:pointer;font-size:13px;font-weight:800;transition:all .2s}
.nav-prev{background:#FFE8CC;color:#C4733A}
.nav-next{color:#fff;box-shadow:0 3px 10px rgba(255,107,107,.25)}
.nav-btn:disabled{opacity:.28;cursor:default;box-shadow:none}
</style>

const CONFETTI_COLORS=['#FF8C42','#FF6B6B','#5DBB63','#4A90E2','#FFD700','#FF69B4','#9C27B0'];

function Confetti(){
  const dots=Array.from({length:25},(_,i)=>({
    id:i,color:CONFETTI_COLORS[i%CONFETTI_COLORS.length],
    left:Math.random()*100,delay:Math.random()*0.8,dur:1.2+Math.random()*0.8,
  }));
  return e('div',{className:'confetti-wrap'},
    dots.map(d=>e('div',{key:d.id,className:'confetti-dot',
      style:{background:d.color,left:d.left+'%',top:'-10px',
        animationDuration:d.dur+'s',animationDelay:d.delay+'s'}}))
  );
}


function LottieAnim({size=80}){
  const ref=useRef(null);
  const[loaded,setLoaded]=useState(false);
  useEffect(()=>{
    if(!ref.current)return;
    try{
      const anim=window.lottie&&window.lottie.loadAnimation({
        container:ref.current,
        renderer:'svg',
        loop:true,
        autoplay:true,
        animationData:LOTTIE_DATA,
      });
      if(anim){setLoaded(true);return()=>anim.destroy();}
    }catch(err){console.warn('lottie error',err);}
  },[]);
  return e('div',{style:{width:size,height:size,display:'flex',alignItems:'center',justifyContent:'center'}},
    e('div',{ref,style:{width:size,height:size,display:loaded?'block':'none'}}),
    !loaded&&e('div',{style:{fontSize:size*0.5}},'🌱')
  );
}

      ),
      e('div',{className:'ob-footer'},
        e('div',{className:'ob-dots'},[0,1,2].map(i=>e('div',{key:i,className:'ob-dot'+(obStep===i?' act':'')}))),
        e('button',{className:'ob-btn',onClick:()=>setObStep(1)},'다음 →'),
        e('button',{className:'ob-skip',onClick:finishOb},'건너뛰기')
      )
    ),
    obStep===1&&e('div',{key:'s1',className:'ob'},
      e('div',{style:{fontSize:44,marginBottom:12}},'📖'),
      e('div',{className:'ob-title',style:{fontSize:20}},'이렇게 배워요'),
      e('div',{className:'ob-desc',style:{marginBottom:14}},'가족의 대화로 자연스럽게\n복잡한 개념을 이해해요'),
      e('div',{className:'ob-how'},
        [{ico:'💬',t:'이야기 읽기',d:'우노짱·오짱·푸른이의 실제 대화로\n반도체를 자연스럽게 만나요'},
         {ico:'✨',t:'핵심 사실 카드',d:'이야기 속 개념을 3개의 카드로\n정리해드려요'},
         {ico:'🧩',t:'퀴즈로 확인',d:'배운 내용을 퀴즈로 점검해요\n틀려도 괜찮아요, 다시 도전!'},
         {ico:'🌟',t:'에피소드 완료',d:'완료하면 ✅ 표시가 남아요\n5개를 모두 모아보세요'},
        ].map((item,i)=>e('div',{key:i,className:'ob-how-row'},
          e('div',{className:'ob-how-ico'},item.ico),
          e('div',null,e('div',{className:'ob-how-t'},item.t),e('div',{className:'ob-how-d'},item.d))
        ))
      ),
      e('div',{className:'ob-footer'},
        e('div',{className:'ob-dots'},[0,1,2].map(i=>e('div',{key:i,className:'ob-dot'+(obStep===i?' act':'')}))),
        e('button',{className:'ob-btn',onClick:()=>setObStep(2)},'다음 →'),
        e('button',{className:'ob-skip',onClick:()=>setObStep(0)},'← 이전')
      )
    ),
    obStep===2&&e('div',{key:'s2',className:'ob'},
      e('div',{style:{fontSize:50,marginBottom:12}},'🚀'),
      e('div',{className:'ob-title',style:{fontSize:20}},'준비됐나요?'),
      e('div',{className:'ob-desc',style:{marginBottom:14}},'반도체 이야기 5화가 기다리고 있어요'),
      e('div',{className:'ob-ep-preview',style:{maxHeight:'none',overflowY:'visible'}},
        e('div',{className:'ob-ep-preview-title'},'에피소드 목록 ('+EPISODES.length+'화)'),
        EPISODES.map((ep,i)=>e('div',{key:i,className:'ob-ep-row'},
          e('span',{style:{fontSize:16}},ep.emoji),
          e('span',{style:{fontSize:11,fontWeight:700,color:ep.color,minWidth:28}},'EP'+ep.num),
          e('span',{style:{fontSize:11,color:'#3D2B1F'}},ep.title)
        ))
      ),
      e('div',{className:'ob-footer'},
        e('div',{className:'ob-dots'},[0,1,2].map(i=>e('div',{key:i,className:'ob-dot'+(obStep===i?' act':'')}))),
        e('button',{className:'ob-btn',onClick:finishOb},'시작하기 🌟'),
        e('button',{className:'ob-skip',onClick:()=>setObStep(1)},'← 이전')
      )
    )
  );

  // ── ALL COMPLETE ──
  if(allDone&&screen==='all-complete') return e('div',{style:{flex:1,overflowY:'auto',background:'linear-gradient(160deg,#FFF8F0,#FFE8CC)'}},
    e('div',{className:'all-complete'},
      e('div',{style:{fontSize:52,marginBottom:12}},'🎉'),
      e('div',{style:{fontSize:20,fontWeight:800,color:'#D4611A',marginBottom:4}},'반도체편 완주!'),
      e('div',{style:{fontSize:13,color:'#8B6347',marginBottom:20,lineHeight:1.7}},
        '5개의 에피소드를 모두 완료했어요.\n이제 반도체의 기초를 이해했어요!'
      ),
      e('div',{className:'cert-box'},
        e('div',{className:'cert-stamp'},'🌟'),
        e('div',{className:'cert-top'},'CERTIFICATE OF COMPLETION'),
        e('div',{className:'cert-logo'},'🌱'),
        e('div',{className:'cert-title'},'푸른시점 반도체편'),
        e('div',{className:'cert-name'},'완주 수료증'),
        e('div',{className:'cert-list'},
          EPISODES.map((ep,i)=>e('div',{key:i,className:'cert-item'},
            e('span',null,ep.emoji),
            e('span',{style:{fontWeight:700,color:ep.color}},'EP'+ep.num),
            e('span',null,ep.title),
            e('span',{style:{marginLeft:'auto',color:'#5DBB63'}},'✅')
          ))
        ),
        e('div',{className:'cert-bottom'},'푸른시점 산업편 · UNO_DEYA')
      ),
      e('button',{onClick:()=>setScreen('splash'),
        style:{background:'linear-gradient(135deg,#FF8C42,#FF6B6B)',color:'#fff',border:'none',borderRadius:14,padding:'13px 32px',fontSize:14,fontWeight:800,cursor:'pointer',boxSizing:'border-box'}},
        '다시 보기 🔄')
    )
  );

  // ── SPLASH ──
  // ── SPLASH (랜디톡 스타일) ──
  const SECTIONS=[
    {id:'basic', label:'기초편', eps:[0,1,2,3,4]},
    {id:'deep',  label:'심화편', eps:[5,6,7,8,9]},
    {id:'news',  label:'뉴스편', eps:[10,11,12,13,14]},
  ];
  const curSection=SECTIONS.find(s=>s.id===homeTab)||SECTIONS[0];

  if(screen==='splash') return e('div',{style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'#FFF8F0'}},

    // 헤더
    e('div',{style:{padding:'14px 16px 10px',background:'#FFF8F0',borderBottom:'1px solid #FFE8CC',flexShrink:0}},
      e('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:10}},
        e('div',{style:{cursor:'pointer'},onClick:()=>{try{localStorage.removeItem('p_ob');}catch{}setOnboarded(false);setObStep(0);}},e(LottieAnim,{size:40})),
        e('div',{style:{flex:1}},
          e('div',{style:{fontSize:18,fontWeight:900,color:'#D4611A',letterSpacing:'-.5px'}},'푸른시점'),
          e('div',{style:{fontSize:10,color:'#E8934A',fontWeight:700,letterSpacing:'1px'}},'반도체편')
        ),
        e('div',{style:{display:'flex',gap:8,alignItems:'center'}},
          e('div',{style:{display:'flex',gap:6}},
            Object.values(CHARS).map(ch=>e('div',{key:ch.name,style:{width:30,height:30,borderRadius:'50%',background:ch.bg,display:'flex',alignItems:'center',justifyContent:'center',fontSize:15,border:'2px solid rgba(0,0,0,.07)'}},ch.emoji))
          )
        )
      ),
      // 진행률 바
      e('div',{style:{background:'#FFE8CC',borderRadius:8,height:5,overflow:'hidden'}},
        e('div',{style:{height:'100%',width:(doneEps.size/EPISODES.length*100)+'%',background:'linear-gradient(90deg,#FF8C42,#FFB347)',borderRadius:8,transition:'width .4s'}})
      ),
      e('div',{style:{display:'flex',justifyContent:'space-between',marginTop:4}},
        e('span',{style:{fontSize:10,color:'#C4A882'}},'전체 진행률'),
        e('span',{style:{fontSize:10,fontWeight:700,color:'#FF8C42'}},(doneEps.size)+'/'+EPISODES.length+'화 완료')
      )
    ),

    // 섹션 탭
    e('div',{style:{display:'flex',borderBottom:'2px solid #FFE8CC',background:'#FFF8F0',flexShrink:0}},
      SECTIONS.map(sec=>e('div',{key:sec.id,
        onClick:()=>setHomeTab(sec.id),
        style:{flex:1,padding:'10px 4px',textAlign:'center',fontSize:12,fontWeight:700,
          color:homeTab===sec.id?'#FF8C42':'#C4A882',
          borderBottom:homeTab===sec.id?'2px solid #FF8C42':'2px solid transparent',
          cursor:'pointer',marginBottom:-2,transition:'all .2s'}},
        sec.label
      ))
    ),

    // 에피소드 리스트
    e('div',{style:{flex:1,overflowY:'auto',WebkitOverflowScrolling:'touch',padding:'12px 14px 24px'}},
      curSection.eps.map(i=>{
        const ep=EPISODES[i];
        const done=doneEps.has(i);
        return e('div',{key:i,
          onClick:()=>startEp(i),
          style:{background:'#fff',borderRadius:16,marginBottom:10,overflow:'hidden',border:'1.5px solid '+(done?'#5DBB63':'#FFE0C0'),boxShadow:'0 2px 8px rgba(0,0,0,.05)',cursor:'pointer',display:'flex'}},

          // 삽화 플레이스홀더
          e('div',{style:{width:100,flexShrink:0,background:'linear-gradient(135deg,'+ep.color+'22,'+ep.color+'11)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,padding:'12px 8px',borderRight:'1px dashed '+ep.color+'40'}},
            e('div',{style:{fontSize:28}},ep.emoji),
            e('div',{style:{fontSize:7,color:ep.color,fontWeight:700,textAlign:'center',lineHeight:1.4,background:ep.color+'15',padding:'2px 6px',borderRadius:6}},
              '삽화 '+ep.num+'\n(제미나이)')
          ),

          // 텍스트
          e('div',{style:{flex:1,padding:'12px 13px',display:'flex',flexDirection:'column',justifyContent:'center'}},
            e('div',{style:{display:'flex',gap:5,marginBottom:5,alignItems:'center'}},
              e('span',{style:{fontSize:9,fontWeight:800,color:ep.color,background:ep.color+'15',padding:'2px 6px',borderRadius:6}},
                'EP'+ep.num),
              done&&e('span',{style:{fontSize:9,fontWeight:700,color:'#5DBB63',background:'#5DBB6315',padding:'2px 6px',borderRadius:6}},'완료 ✅'),
              e('span',{style:{fontSize:9,color:'#C4A882',marginLeft:'auto'}},
                i<5?'기초':i<10?'심화':'뉴스')
            ),
            e('div',{style:{fontSize:13,fontWeight:800,color:'#3D2B1F',lineHeight:1.4,marginBottom:4}},ep.title),
            e('div',{style:{fontSize:10,color:'#C4A882'}},ep.pages.length-1+'장면 · 퀴즈 1개')
          )
        );
      }),
      allDone&&e('button',{onClick:()=>setScreen('all-complete'),
        style:{background:'linear-gradient(135deg,#FFD700,#FF8C42)',color:'#fff',border:'none',borderRadius:14,padding:'12px',width:'100%',fontSize:13,fontWeight:800,cursor:'pointer',marginTop:4}},
        '🎉 수료증 보기')
    )
  );

  // ── READER ──
  // 퀴즈 답변 상태 (quizIdx별)
  const quizCount=EP.filter(p=>p.type==='quiz').length;
  const quizDone=Object.keys(quizSels).length;
  const curQuizBlocked=P.type==='quiz'&&quizSels[P.quizIdx]===undefined;

  // 삽화 플레이스홀더
  function IllustPH({illust}){
    return e('div',{style:{borderRadius:14,overflow:'hidden',marginBottom:12}},
      e('div',{style:{height:150,background:illust.bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:6,border:'2px dashed var(--border)'}},
        e('div',{style:{fontSize:40}},illust.emoji),
        e('div',{style:{fontSize:9,fontWeight:700,color:'#fff',background:'rgba(0,0,0,.3)',padding:'3px 10px',borderRadius:20}},illust.label),
        e('div',{style:{fontSize:8,color:'var(--text2)',textAlign:'center',lineHeight:1.4}},illust.desc)
      )
    );
  }

  function Bubbles({bubbles}){
    return e('div',{className:'bubbles'},bubbles.map((b,i)=>{
      const ch=CHARS[b.char];
      return e('div',{key:i,className:'bubble-row'+(b.side==='right'?' right':'')},
        e('div',{className:'avatar',style:{background:ch.bg}},ch.emoji),
        e('div',{className:'bubble '+(b.side==='left'?'left':'right'),style:b.side==='right'?{background:ch.color}:{}},
          e('div',{className:'bname'},ch.name),b.text)
      );
    }));
  }

  return e('div',{className:'reader'},
    e('div',{className:'reader-header'},
      e('button',{className:'back-btn',onClick:()=>setScreen('splash')},'←'),
      e('div',{className:'ep-info'},
        e('div',{className:'ep-num-hd',style:{color:ep.color}},'EP'+ep.num+' · 약 8분'),
        e('div',{className:'ep-title-hd'},ep.title)
      ),
      e('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:3}},
        e('div',{className:'prog-dots'},
          EP.map((_,i)=>e('div',{key:i,className:'prog-dot'+(i===page?' act':''),style:i===page?{background:ep.color,width:14}:{}}))
        ),
        quizCount>0&&e('div',{style:{fontSize:8,color:'#C4A882'}},
          '퀴즈 '+quizDone+'/'+quizCount)
      )
    ),
    e('div',{className:'page-scroll'},e('div',{className:'page',key:page},

      // SCENE
      P.type==='scene'&&e(React.Fragment,null,
        e(IllustPH,{illust:P.illust}),
        e('div',{style:{fontSize:11,fontWeight:700,color:'var(--text2)',textAlign:'center',marginBottom:10,padding:'6px 12px',background:'rgba(0,0,0,.03)',borderRadius:8}},P.caption),
        e(Bubbles,{bubbles:P.bubbles})
      ),

      // FACT
      P.type==='fact'&&e(React.Fragment,null,
        e('div',{className:'fact-title-row'},'✨ 핵심 정리'),
        P.facts.map((f,i)=>e('div',{key:i,className:'fact-box',style:{background:f.bg,borderLeftColor:f.color}},
          e('span',{className:'fact-ico'},f.icon),
          e('div',{className:'fact-t',style:{color:f.color}},f.title),
          e('div',{className:'fact-d'},f.text)
        ))
      ),

      // DEEP
      P.type==='deep'&&e(React.Fragment,null,
        e(IllustPH,{illust:P.illust}),
        e('div',{style:{fontSize:11,fontWeight:700,color:'var(--text2)',textAlign:'center',marginBottom:10,padding:'6px 12px',background:'rgba(0,0,0,.03)',borderRadius:8}},P.caption),
        e(Bubbles,{bubbles:P.bubbles}),
        e('div',{style:{background:'linear-gradient(135deg,#FFF3E0,#FFE8CC)',borderRadius:12,padding:'12px 14px',border:'1.5px solid var(--border)',marginTop:4}},
          e('div',{style:{fontSize:11,fontWeight:800,color:'#FF8C42',marginBottom:6}},'🔍 더 깊이'),
          e('div',{style:{fontSize:13,color:'var(--text)',lineHeight:1.75}},P.deepNote)
        )
      ),

      // QUIZ
      P.type==='quiz'&&e('div',null,
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}},
          e('div',{className:'quiz-title-row',style:{margin:0}},'🧩 퀴즈 '+(P.quizIdx+1)+'/'+quizCount),
          e('div',{style:{display:'flex',gap:4}},
            Array.from({length:quizCount},(_,i)=>e('div',{key:i,style:{width:8,height:8,borderRadius:'50%',background:i<quizDone?'#5DBB63':i===P.quizIdx?'#D4467A':'var(--border)'}}))
          )
        ),
        e('div',{className:'quiz-box'},
          e('div',{className:'quiz-q'},P.q),
          e('div',{className:'quiz-opts'},P.opts.map((opt,i)=>
            e('button',{key:i,
              className:'quiz-opt'+(quizSels[P.quizIdx]===i?(i===P.ans?' correct':' wrong'):''),
              onClick:()=>setQuizSels(prev=>({...prev,[P.quizIdx]:i})),
              disabled:quizSels[P.quizIdx]!==undefined},opt)
          )),
          quizSels[P.quizIdx]!==undefined&&e('div',{className:'quiz-result',
            style:{background:quizSels[P.quizIdx]===P.ans?'#E8F8E8':'#FFF0F0',
              color:quizSels[P.quizIdx]===P.ans?'#2D7A32':'#CC3333'}},
            quizSels[P.quizIdx]===P.ans?P.correct:P.wrong)
        )
      ),

      // COMPLETE
      P.type==='complete'&&e('div',{className:'complete-box'},
        e(Confetti),
        e('div',{className:'complete-star'},'🌟'),
        e('div',{className:'complete-title'},'에피소드 '+ep.num+' 완료!'),
        e('div',{className:'complete-sub'},'퀴즈 '+quizDone+'/'+quizCount+' 완료!\n오늘 배운 내용 정리해요 😊'),
        e('div',{className:'complete-review'},
          e('div',{className:'review-title'},'📋 핵심 요약'),
          (P.review||[]).map((r,i)=>e('div',{key:i,className:'review-item'},
            e('div',{style:{width:20,height:20,borderRadius:'50%',background:ep.color,color:'#fff',fontSize:9,fontWeight:800,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1}},i+1),r
          ))
        ),
        P.nextNum>0&&e('div',{style:{background:'linear-gradient(135deg,#4A90E2,#5C6BC0)',borderRadius:14,padding:14,color:'#fff',marginBottom:12,textAlign:'left'}},
          e('div',{style:{fontSize:9,fontWeight:700,opacity:.75,marginBottom:4,letterSpacing:1}},'NEXT EPISODE'),
          e('div',{style:{fontSize:14,fontWeight:800,marginBottom:5}},'EP'+P.nextNum+' · '+P.nextTitle),
          e('div',{style:{fontSize:11,opacity:.85,lineHeight:1.5,whiteSpace:'pre-line'}},P.nextPreview),
          e('button',{style:{marginTop:10,background:'rgba(255,255,255,.2)',border:'1px solid rgba(255,255,255,.3)',borderRadius:8,padding:'6px 12px',fontSize:11,fontWeight:700,color:'#fff',cursor:'pointer'},
            onClick:()=>startEp(curEp+1)},'다음화 보기 →')
        ),
        P.nextNum<0&&e('button',{onClick:()=>setScreen('all-complete'),
          style:{background:'linear-gradient(135deg,#FFD700,#FF8C42)',color:'#fff',border:'none',borderRadius:12,padding:'12px',width:'100%',fontSize:13,fontWeight:800,cursor:'pointer'}},
          '🎉 수료증 받기!')
      )
    )),
    e('div',{className:'page-nav'},
      e('button',{className:'nav-btn nav-prev',onClick:()=>goPage(page-1),disabled:page===0},'← 이전'),
      e('button',{className:'nav-btn nav-next',
        style:{background:curQuizBlocked?'#ddd':'linear-gradient(135deg,'+ep.color+',#FF6B6B)'},
        onClick:()=>{
          if(isLast){const nd=new Set(doneEps);nd.add(curEp);setDoneEps(nd);saveDone(nd);setScreen('splash');}
          else goPage(page+1);
        },
        disabled:curQuizBlocked
      },isLast?'완료! 🌟':'다음 →')
    )
  );
}

ReactDOM.render(e(App),document.getElementById('root'));
</script>
</body>
</html>
